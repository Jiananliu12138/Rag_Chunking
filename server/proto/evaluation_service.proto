syntax = "proto3";

package meta_chunking.rpc;

import "google/protobuf/struct.proto";

service EvalRpcService {
  rpc TraditionalEval(TraditionalEvalRequest) returns (TraditionalEvalResponse);
  rpc RagasEval(RagasEvalRequest) returns (RagasEvalResponse);
  rpc RetrievalEval(RetrievalEvalRequest) returns (RetrievalEvalResponse);
}

service ComponentEvalRpcService {
  rpc ChunkQualityEval(ChunkQualityEvalRequest) returns (ChunkQualityEvalResponse);
  rpc ChunkStickinessEval(ChunkStickinessEvalRequest) returns (ChunkStickinessEvalResponse);
}

message StringList {
  repeated string items = 1;
}

message TraditionalEvalRequest {
  repeated string predictions = 1;
  repeated StringList answers = 2;
  google.protobuf.Value test = 3;
  optional bool enable_bert_score = 4;
  optional string bert_score_model = 5;
  optional string bert_score_device = 6;
}

message TraditionalEvalResponse {
  double f1 = 1;
  double rouge_l = 2;
  double bleu_1 = 3;
  double bleu_2 = 4;
  double bleu_3 = 5;
  double bleu_4 = 6;
  optional double bert_score_f1 = 7;
  int32 sample_count = 8;
}

message RagasMetricSummary {
  double mean = 1;
  double min = 2;
  double max = 3;
}

message RagasSummary {
  RagasMetricSummary ragas_score = 1;
  RagasMetricSummary faithfulness = 2;
  RagasMetricSummary answer_relevancy = 3;
  RagasMetricSummary context_recall = 4;
  RagasMetricSummary context_precision = 5;
  RagasMetricSummary context_entity_recall = 6;
  RagasMetricSummary noise_sensitivity_relevant = 7;
  RagasMetricSummary noise_sensitivity_irrelevant = 8;
}

message RagasEvalRequest {
  google.protobuf.Value test = 1;
  optional string vllm_api_base = 2;
  optional string vllm_api_key = 3;
  optional string vllm_model_name = 4;
  optional string embedding_model_path = 5;
  optional string device = 6;
  optional bool enable_cache = 7;
  optional string cache_dir = 8;
}

message RagasEvalResponse {
  RagasSummary summary = 1;
  int32 sample_count = 2;
  google.protobuf.Value samples = 3;
}

message RetrievalEvalRequest {
  google.protobuf.Value test = 1;
  repeated int32 cuts = 2;
  optional bool skip_empty_gold = 3;
}

message RetrievalEvalResponse {
  google.protobuf.Value meta = 1;
  google.protobuf.Value aggregated = 2;
  google.protobuf.Value per_query = 3;
  google.protobuf.Value diagnostics = 4;
}

message ChunkQualityEvalRequest {
  google.protobuf.Value chunks = 1;
  optional bool enable_semantic_similarity = 2;
  optional bool enable_boundary_clarity = 3;
  optional double score_temperature = 4;
  optional string sim_model_path = 5;
  optional string vllm_api_base = 6;
  optional string vllm_model_name = 7;
}

message ChunkPairResult {
  optional double semantic_dissimilarity = 1;
  optional double boundary_clarity = 2;
}

message ChunkQualityEvalResponse {
  double avg_semantic_dissimilarity = 1;
  double avg_boundary_clarity = 2;
  int32 num_pairs = 3;
  repeated ChunkPairResult details = 4;
}

message ChunkStickinessEvalRequest {
  google.protobuf.Value chunks = 1;
  optional double threshold = 2;
  optional double delta = 3;
  optional double score_temperature = 4;
  optional string vllm_api_base = 5;
  optional string vllm_model_name = 6;
}

message ChunkStickinessEvalResponse {
  double structural_entropy_complete = 1;
  double structural_entropy_incomplete = 2;
  double normalized_structural_entropy_complete = 3;
  double normalized_structural_entropy_incomplete = 4;
  google.protobuf.Value graph_complete = 5;
  google.protobuf.Value graph_incomplete = 6;
}
